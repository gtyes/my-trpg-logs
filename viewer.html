        function onVnOpeningTouchStart(event) {
            const overlay = document.getElementById('vnOpeningOverlay');
            if (!overlay || !overlay.classList.contains('show')) return;
            if (!event.touches || event.touches.length !== 1) return;

            const touch = event.touches[0];

            // 只有从右边缘开始才算：右侧 8% 或最少 40px
            const edgeWidth = Math.max(40, window.innerWidth * 0.08);
            if (touch.clientX < window.innerWidth - edgeWidth) return;

            vnOpSwipeTracking = true;
            vnOpSwipeStartX = touch.clientX;
            vnOpSwipeStartY = touch.clientY;
        }

        function onVnOpeningTouchEnd(event) {
            if (!vnOpSwipeTracking) return;
            vnOpSwipeTracking = false;

            const overlay = document.getElementById('vnOpeningOverlay');
            if (!overlay || !overlay.classList.contains('show')) return;

            const touch = event.changedTouches && event.changedTouches[0];
            if (!touch) return;

            const dx = vnOpSwipeStartX - touch.clientX; // 向左滑为正
            const dy = Math.abs(touch.clientY - vnOpSwipeStartY);

            // 向左滑超过 60px，且水平距离大于垂直距离
            if (dx > 60 && dx > dy) {
                console.log('[OP] 右边缘左滑，跳过 OP');
                closeVnOpening();
            }
        }

                return;
            }          
            const startIndex = getCurrentReadingIndex();
            vnSteps = buildVnSteps();

            if (!vnSteps.length) {
                alert('没有可阅读的消息');
                return;
            }

            let stepIndex = vnSteps.findIndex(s => s.index >= startIndex);
            if (stepIndex === -1) stepIndex = 0;

            vnIndex = stepIndex;

            document.getElementById('vnOverlay').classList.add('show');
            updateVnHideChatUI();
            if (shouldAutoFullscreen()) {
                requestVnFullscreen();
            }

            document.body.classList.add('vn-active');

            document.addEventListener('keydown', vnKeyHandler);
            initVnMediaEvents();
            clearVnForegroundLayers();

            const firstMessageStep = vnSteps.findIndex(step => step.type !== 'chapter');

            // 第一条有正文的消息，跳过空文本消息
            const firstReadableStep = vnSteps.findIndex(step =>
                step.type === 'message' &&
                step.msg &&
                (step.msg.text || '').trim() !== ''
            );

            const atFirstMessage =
                vnIndex === 0 ||
                vnIndex === firstMessageStep;

            if (hasVnOpeningVideo() && atFirstMessage) {
                openVnOpening(() => {
                    vnIndex = firstReadableStep !== -1
                        ? firstReadableStep
                        : (firstMessageStep !== -1 ? firstMessageStep : 0);

                    console.log('[OP] 结束后进入 step:', vnIndex, vnSteps[vnIndex]);

                    renderVnStep();
                });
            } else {
                renderVnStep();
            }

        }


        function closeVnMode() {
            clearVnTimers();
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }

            document.getElementById('vnOverlay').classList.remove('show');
            document.body.classList.remove('vn-active');

            document.removeEventListener('keydown', vnKeyHandler);

            vnOrientationBlocked = false;
            const hint = document.getElementById('vnRotateHint');
            if (hint) hint.classList.remove('show');

            // 退出对话模式时停止 BGM
            stopVnBgm();
            stopVnSfx();
            setVnSpeechForStep(null);

            clearVnForegroundLayers();
            cancelVnOpening();
        }

        function toggleVnChapterMenu() {
            setVnLogDrawerOpen(false);
            const logMenu = document.getElementById('vnLogMenu');
            if (logMenu) logMenu.classList.remove('show');

            const menu = document.getElementById('vnChapterMenu');
            if (!menu) return;

            if (menu.classList.contains('show')) {
                menu.classList.remove('show');
                return;
            }

            renderVnChapterMenu();
            menu.classList.add('show');
        }

        function renderVnChapterMenu() {
            const menu = document.getElementById('vnChapterMenu');
            if (!menu) return;

            menu.innerHTML = '';

            const chapterSteps = [];
            vnSteps.forEach((step, index) => {
                if (step.type === 'chapter') {
                    chapterSteps.push({ step, index });
                }
            });

            if (!chapterSteps.length) {
                const empty = document.createElement('div');
                empty.className = 'vn-chapter-empty';
                empty.textContent = '没有章节';
                menu.appendChild(empty);
                return;
            }

            const currentStep = vnSteps[vnIndex];
            const currentChapterName = currentStep ? currentStep.chapterName : '';

            chapterSteps.forEach(({ step, index }) => {
                const btn = document.createElement('button');
                btn.className = 'vn-chapter-item';
                btn.textContent = step.chapterName || '未命名章节';

                if (step.chapterName === currentChapterName) {
                    btn.classList.add('current');
                }

                btn.addEventListener('click', event => {
                    event.stopPropagation();
                    jumpVnChapter(index);
                });

                menu.appendChild(btn);
            });
        }

        function jumpVnChapter(stepIndex) {
            const menu = document.getElementById('vnChapterMenu');
            if (menu) menu.classList.remove('show');

            if (stepIndex < 0 || stepIndex >= vnSteps.length) return;

            vnIndex = stepIndex;
            renderVnStep();
        }

        function clearVnTimers() {
            if (vnTypeTimer) {
                clearInterval(vnTypeTimer);
                vnTypeTimer = null;
            }
            if (vnAutoTimer) {
                clearTimeout(vnAutoTimer);
                vnAutoTimer = null;
            }
            if (vnPageTimer) {
                clearTimeout(vnPageTimer);
                vnPageTimer = null;
            }
        }
        function getVnNextPageDelay() {
            const audio = document.getElementById('vnSpeechAudio');
            if (!audio || !audio.getAttribute('src') || vnSpeechAutoplayFailed
                || audio.ended || !Number.isFinite(audio.duration) || audio.duration <= 0) {
                return 1500;
            }

            const textProgress = Math.min(1, vnTextIndex / Math.max(1, vnCurrentText.length));
            const targetAudioTime = audio.duration * textProgress;
            const currentAudioTime = Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
            return Math.max(1000, (targetAudioTime - currentAudioTime) * 1000);
        }

        function scheduleVnNextPage(delay) {
            if (vnPageTimer) {
                clearTimeout(vnPageTimer);
                vnPageTimer = null;
            }

            const expectedStep = vnIndex;
            const expectedPageStart = vnPageStart;

            vnPageTimer = setTimeout(() => {
                vnPageTimer = null;

                // 用户已经手动翻走，或者已经不是这一页了
                if (!vnHasMoreText) return;
                if (vnTyping) return;
                if (vnIndex !== expectedStep) return;
                if (vnPageStart !== expectedPageStart) return;

                // 只继续文本，不重新 render step，所以立绘不会被清掉
                startVnTyping(vnCurrentText, vnTextIndex);
            }, delay === undefined ? getVnNextPageDelay() : delay);
        }

        function vnKeyHandler(event) {
            const opOverlay = document.getElementById('vnOpeningOverlay');
            const opOpen = opOverlay && opOverlay.classList.contains('show');

            // Esc：优先退出全屏，不关闭 OP / 对话模式
            if (event.key === 'Escape') {
                event.preventDefault();

                const isFullscreen = !!(
                    document.fullscreenElement ||
                    document.webkitFullscreenElement
                );

                if (isFullscreen) {
                    if (document.exitFullscreen) {
                        document.exitFullscreen().catch(() => {});
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                    return;
                }

                // 不在全屏时，Esc 才关闭 OP
                if (opOpen) {
                    closeVnOpening();
                    return;
                }

                // 没有 OP，Esc 关闭对话模式
                closeVnMode();
                return;
            }

            // OP 打开期间，方向键/空格不响应
            if (opOpen) return;

            if (event.key === 'ArrowRight' || event.key === ' ' || event.key === 'Enter') {
                event.preventDefault();
                nextVn();
            } else if (event.key === 'ArrowLeft') {
                event.preventDefault();
                prevVn();
            }
        }


        function vnHandleClick(event) {
            if (event.target.closest('.vn-log-drawer')) return;

            const chapterMenu = document.getElementById('vnChapterMenu');

            if (chapterMenu &&
                chapterMenu.classList.contains('show') &&
                !event.target.closest('.vn-topbar')) {
                chapterMenu.classList.remove('show');
                return;
            }

            if (event.target.closest('.vn-topbar')) return;

            nextVn();
        }


        function nextVn() {
            // 还在打字：先把当前页打完
            if (vnTyping) {
                completeVnTyping();
                return;
            }

            // 当前消息还有下一页：从对话框顶部继续打
            if (vnHasMoreText) {
                startVnTyping(vnCurrentText, vnTextIndex);
                return;
            }

            // 没有下一页，进入下一条消息
            if (vnIndex >= vnSteps.length - 1) {
                document.getElementById('vnHint').textContent = '已经是最后一句';

                if (vnAutoTimer) {
                    clearTimeout(vnAutoTimer);
                    vnAutoTimer = null;
                }
                return;
            }

            vnIndex++;
            renderVnStep();
        }

        function prevVn() {
            clearVnTimers();

            if (vnIndex <= 0) {
                renderVnStep();
                return;
            }

            vnIndex--;
            renderVnStep();
        }

        function toggleVnMute() {
            vnMuted = !vnMuted;
            updateVnMuteUI();
        }

        function updateVnMuteUI() {
            const btn = document.getElementById('vnMuteBtn');
            if (btn) {
                btn.textContent = vnMuted ? '静音：开' : '静音：关';
            }

            // BGM
            if (vnBgmAudio) {
                vnBgmAudio.muted = vnMuted;
            }

            // 音效
            vnSfxAudios.forEach(audio => {
                audio.muted = vnMuted;
            });
            if (vnBrowserSpeechUtterance) {
                vnBrowserSpeechUtterance.volume = vnMuted ? 0 : 1;
            }

            const speechAudio = document.getElementById('vnSpeechAudio');
            if (speechAudio) {
                speechAudio.muted = vnMuted;
            }

            // OP 本地视频
            const video = document.getElementById('vnOpeningVideo');
            if (video) {
                video.muted = vnMuted;
            }

            // OP Vimeo
            if (vnVimeoPlayer && vnVimeoPlayer.setVolume) {
                vnVimeoPlayer.setVolume(vnMuted ? 0 : 1).catch(() => {});
            }
        }

        function toggleVnAuto() {
            vnAuto = !vnAuto;

            const btn = document.getElementById('vnAutoBtn');
            btn.textContent = vnAuto ? '自动：开' : '自动：关';

            if (vnAuto) {
                if (vnHasMoreText && !vnTyping) {
                    scheduleVnNextPage();
                } else if (!vnTyping) {
                    scheduleVnAuto();
                }
            } else {
                if (vnAutoTimer) {
                    clearTimeout(vnAutoTimer);
                    vnAutoTimer = null;
                }
            }
        }
        function updateVnHideChatUI() {
            const btn = document.getElementById('vnHideChatBtn');
            if (!btn) return;
            btn.textContent = vnHideChat ? '屏蔽闲聊：开' : '屏蔽闲聊：关';
        }

        function toggleVnHideChat() {
            vnHideChat = !vnHideChat;
            updateVnHideChatUI();

            const overlay = document.getElementById('vnOverlay');
            if (!overlay || !overlay.classList.contains('show')) return;

            clearVnTimers();

            // 记住当前所在位置，重建 steps 后尽量回到同一条消息
            const oldStep = vnSteps[vnIndex];
            const anchorId = oldStep && oldStep.msg && oldStep.msg.id !== undefined
                ? String(oldStep.msg.id)
                : null;
            const anchorPosition = oldStep ? (oldStep.position || 0) : 0;
            const wasChapter = !!(oldStep && oldStep.type === 'chapter');

            vnSteps = buildVnSteps();

            if (!vnSteps.length) {
                closeVnMode();
                return;
            }

            // 优先按消息 id 找回；当前消息被屏蔽时，落到它后面的第一条可见消息
            let newIndex = -1;

            if (anchorId !== null) {
                newIndex = vnSteps.findIndex(s =>
                    s.msg && s.msg.id !== undefined && String(s.msg.id) === anchorId
                );
            }

            if (newIndex === -1 && wasChapter) {
                newIndex = vnSteps.findIndex(s =>
                    s.type === 'chapter' && (s.position || 0) === anchorPosition
                );
            }

            if (newIndex === -1) {
                newIndex = vnSteps.findIndex(s => (s.position || 0) >= anchorPosition);
            }

            if (newIndex === -1) newIndex = vnSteps.length - 1;

            vnIndex = Math.max(0, newIndex);
            renderVnStep();

            // 对话列表如果正开着，重建窗口并回到当前句
            const drawer = document.getElementById('vnLogDrawer');
            if (drawer && drawer.classList.contains('show')) {
                renderVnLogMenu(true);
            }
        }

        function scheduleVnAuto(delay) {
            if (!vnAuto) return;

            if (vnAutoTimer) {
                clearTimeout(vnAutoTimer);
                vnAutoTimer = null;
            }

            if (vnTyping || hasActiveVnSfx()) return;
            if (vnBrowserSpeechUtterance && vnBrowserSpeechStepIndex === vnIndex) return;

            const audio = document.getElementById('vnSpeechAudio');
            const hasSpeechAudio = audio && audio.getAttribute('src');
            if (hasSpeechAudio && !vnSpeechAutoplayFailed && !audio.ended) return;
            if (delay === undefined && hasSpeechAudio && !vnSpeechAutoplayFailed) {
                delay = 800;
            }

            const wait = delay !== undefined ? delay : 1200 + vnCurrentText.length * 45;

            vnAutoTimer = setTimeout(() => {
                vnAutoTimer = null;
                if (vnAuto) nextVn();
            }, wait);
        }

        function hasActiveVnSfx() {
            return vnSfxAudios.some(audio =>
                audio._vnPlaybackStarted === true && !audio.ended && !audio.error
            );
        }

        function renderVnStep() {
            clearVnTimers();
            refreshVnLogMenuCurrent();
            const chapterMenu = document.getElementById('vnChapterMenu');
            if (chapterMenu) chapterMenu.classList.remove('show');

            const logMenu = document.getElementById('vnLogMenu');
            if (logMenu) logMenu.classList.remove('show');

            let step = vnSteps[vnIndex];

            if (!step) {
                vnIndex = 0;
                step = vnSteps[vnIndex];
            }

            if (!step) {
                console.warn('[VN] 没有任何可显示的 step');
                return;
            }

            const stepIndex = vnIndex;
            preloadUpcomingVnImages();
            setVnSpeechForStep(step);
            updateVnLogDrawerBackground(); 
            const overlay = document.getElementById('vnOverlay');
            const bg = document.getElementById('vnBg');
            const bgNext = document.getElementById('vnBgNext');
            const dialog = document.getElementById('vnDialog');
            const chapterCard = document.getElementById('vnChapterCard');
            const imageStage = document.getElementById('vnImageStage');
            const stageImage = document.getElementById('vnStageImage');
            const extendImageOverlay = document.getElementById('vnExtendImageOverlay');
            const extendImageEl = document.getElementById('vnExtendImage');

            // 新增：渲染左右立绘
            renderVnPortraits(step);
            // 每次切换步骤先取消加暗
            bg.classList.remove('chat-dim');
            if (bgNext) bgNext.classList.remove('chat-dim');
            // 每次切换步骤，先把图片层收起来
            imageStage.classList.remove('show');
            stageImage.onload = null;
            stageImage.onerror = null;
            stageImage.removeAttribute('src');
            extendImageOverlay.classList.remove('show');
            extendImageEl.onload = null;
            extendImageEl.onerror = null;
            extendImageEl.removeAttribute('src');

            // 应用背景切换事件
            applyVnBackgroundForStep(step);
            applyVnForegroundForStep(step); 
            // 应用 BGM 切换事件
            applyBgmForPosition(step.position || 0);

            applySfxForPosition(step.position || 0, step);

            // 章节卡
            if (step.type === 'chapter') {
                chapterCard.classList.add('show');
                dialog.style.display = 'none';

                document.getElementById('vnChapterName').textContent =
                    step.chapterName || '新章节';

                vnTyping = false;
                vnCurrentText = '';

                if (vnAuto) scheduleVnAuto(2000);
                return;
            }


            chapterCard.classList.remove('show');
            dialog.style.display = '';   // 清掉内联样式，回到 CSS 的 flex

            const msg = step.msg;

            // 旁白
            if (step.type === 'system') {
                dialog.className = 'vn-dialog system';
                const nameEl = document.getElementById('vnName');
                nameEl.textContent = '';
                nameEl.style.display = 'none';   // 不显示“旁白”这个词

                document.getElementById('vnExtend').style.display = 'none';

                startVnTyping(msg.text || '');
                return;
            }


            // 普通消息
            const isChat = isChatChannelName(msg.channel);

            // 闲聊时背景加暗，其他频道不加暗
            bg.classList.toggle('chat-dim', isChat);
            if (bgNext) bgNext.classList.toggle('chat-dim', isChat);

            // 对话框不再加 chat 类
            dialog.className = 'vn-dialog';

            const nameEl = document.getElementById('vnName');
            nameEl.style.display = '';          // ← 从旁白分支恢复角色名显示
            nameEl.textContent = msg.name || '未知角色';
            nameEl.style.color =
                msg.color ||
                (logData.characterRules && logData.characterRules[msg.name]
                    ? logData.characterRules[msg.name].nameColor
                    : '#ffffff');

            if (msg.to) {
                nameEl.textContent += ` > @${msg.to}`;
            }



            // 骰子/扩展信息
            const extendText = getFormattedExtendText(msg) || '';
            const extendEl = document.getElementById('vnExtend');
            extendEl.textContent = extendText;
            extendEl.style.display = extendText ? 'block' : 'none';
            extendEl.style.visibility = 'hidden';
            // 大成功/大失败的图片：居中最高层显示
            if (msg.dice || msg.extend) {
                const resultType = getExtendResultType(msg);
                const resultImage = getExtendImage(resultType);

                if (resultImage) {
                    extendImageEl.onload = () => {
                        if (vnIndex === stepIndex) extendImageOverlay.classList.add('show');
                    };
                    extendImageEl.onerror = () => {
                        if (vnIndex !== stepIndex) return;
                        extendImageOverlay.classList.remove('show');
                        console.warn('[VN] 判定图片加载失败:', resultImage);
                    };
                    extendImageEl.src = resultImage;
                    if (extendImageEl.complete && extendImageEl.naturalWidth > 0) {
                        extendImageOverlay.classList.add('show');
                    }
                }
            }

            // 消息内图片：居中材料展示
            if (msg.messageImage) {
                stageImage.onload = () => {
                    if (vnIndex === stepIndex) imageStage.classList.add('show');
                };
                stageImage.onerror = () => {
                    if (vnIndex !== stepIndex) return;
                    imageStage.classList.remove('show');
                    console.warn('[VN] 材料图片加载失败:', msg.messageImage);
                };
                stageImage.src = msg.messageImage;
                if (stageImage.complete && stageImage.naturalWidth > 0) {
                    imageStage.classList.add('show');
                }

                const frame = imageStage.querySelector('.vn-image-frame');
                if (frame) {
                    // 闲聊频道不显示黑色底框
                    frame.classList.toggle('no-frame', isChatChannelName(msg.channel));
                }
            }

            startVnTyping(msg.text || '');
        }

        function stopVnBrowserSpeech() {
            const synthesis = window.speechSynthesis;
            vnBrowserSpeechUtterance = null;
            vnBrowserSpeechStepIndex = -1;
            if (synthesis && typeof synthesis.cancel === 'function') {
                synthesis.cancel();
            }
        }

        function getVnBrowserSpeechText(step) {
            if (!step || !step.msg) return '';
            const message = step.msg;
            if (step.type === 'system') {
                return typeof message.text === 'string' ? message.text.trim() : '';
            }
            if (!message.dice && !message.extend) return '';

            return [message.text, getFormattedExtendText(message)]
                .filter(value => typeof value === 'string' && value.trim())
                .join('。');
        }

        function setVnSpeechForStep(step) {
            stopVnBrowserSpeech();
            const message = step && step.msg ? step.msg : null;
            const speechText = getVnBrowserSpeechText(step);
            const synthesis = window.speechSynthesis;
            const SpeechUtterance = window.SpeechSynthesisUtterance;

            if (!speechText || !synthesis || typeof SpeechUtterance !== 'function') {
                setVnSpeechAudio(message);
                return;
            }

            setVnSpeechAudio(null);
            const stepIndex = vnIndex;
            const utterance = new SpeechUtterance(speechText);
            utterance.lang = document.documentElement.lang || 'zh-CN';
            utterance.volume = vnMuted ? 0 : 1;
            vnBrowserSpeechUtterance = utterance;
            vnBrowserSpeechStepIndex = stepIndex;

            utterance.onstart = () => {
                if (vnBrowserSpeechUtterance === utterance) scheduleVnAuto();
            };
            utterance.onend = () => {
                if (vnBrowserSpeechUtterance !== utterance) return;
                vnBrowserSpeechUtterance = null;
                vnBrowserSpeechStepIndex = -1;
                scheduleVnAuto(800);
            };
            utterance.onerror = event => {
                if (vnBrowserSpeechUtterance !== utterance) return;
                vnBrowserSpeechUtterance = null;
                vnBrowserSpeechStepIndex = -1;
                if (event.error !== 'canceled') {
                    console.warn('[VN] 浏览器语音朗读失败:', event.error);
                }
                scheduleVnAuto(800);
            };

            try {
                synthesis.speak(utterance);
            } catch (error) {
                vnBrowserSpeechUtterance = null;
                vnBrowserSpeechStepIndex = -1;
                console.error('[VN] 无法启动浏览器语音朗读:', error);
                setVnSpeechAudio(message);
            }
        }

        function setVnSpeechAudio(message) {
            const audio = document.getElementById('vnSpeechAudio');
            if (!audio) return;

            const stepIndex = vnIndex;
            vnSpeechAutoplayFailed = false;
            audio.onended = null;
            audio.onerror = null;
            audio.onplay = null;
            audio.pause();
            audio.removeAttribute('src');
            audio.hidden = true;

            const url = message && message.ttsDisabled !== true && typeof message.ttsAudioUrl === 'string'
                ? message.ttsAudioUrl.trim()
                : '';
            if (!url) {
                audio.load();
                return;
            }

            audio.src = url;
            audio.muted = vnMuted;
            audio.load();

            audio.onended = () => {
                if (vnIndex !== stepIndex || !vnAuto || vnTyping) return;
                scheduleVnAuto(800);
            };
            audio.onplay = () => {
                vnSpeechAutoplayFailed = false;
                if (vnAutoTimer && !vnTyping && !vnHasMoreText) {
                    clearTimeout(vnAutoTimer);
                    vnAutoTimer = null;
                }
            };
            audio.onerror = () => {
                handleVnSpeechPlaybackFailure(audio, stepIndex, new Error('音频加载失败'));
            };

            const playPromise = audio.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(error => {
                    handleVnSpeechPlaybackFailure(audio, stepIndex, error);
                });
            }
        }

        function handleVnSpeechPlaybackFailure(audio, stepIndex, error) {
            if (error && error.name === 'AbortError') return;
            if (audio !== document.getElementById('vnSpeechAudio') || vnIndex !== stepIndex) return;
            if (vnSpeechAutoplayFailed) return;

            vnSpeechAutoplayFailed = true;
            const mediaError = audio.error;
            const mediaErrorLabels = {
                1: '加载中止',
                2: '网络错误',
                3: '解码失败',
                4: '格式或媒体源不支持'
            };
            const failureReason = mediaError
                ? `语音加载失败（${mediaErrorLabels[mediaError.code] || '未知媒体错误'}，代码 ${mediaError.code}）`
                : error && error.name === 'NotAllowedError'
                    ? '浏览器阻止了语音自动播放'
                    : `语音播放失败（${error && error.name ? error.name : '未知错误'}）`;
            console.warn('[VN] 语音自动播放失败:', {
                error,
                src: audio.currentSrc || audio.src,
                mediaError,
                mediaErrorCode: mediaError && mediaError.code,
                mediaErrorMessage: mediaError && mediaError.message,
                networkState: audio.networkState,
                readyState: audio.readyState
            });
            const hint = document.getElementById('vnHint');
            if (hint) {
                hint.textContent = `${failureReason}，自动推进将按文本节奏继续`;
            }
            if (vnAuto && !vnTyping) {
                if (vnHasMoreText) scheduleVnNextPage();
                else scheduleVnAuto();
            }
        }

        function setVnPortraitSlot(slotId, url, dimmed) {
            const slot = document.getElementById(slotId);
            if (!slot) return;

            const img = slot.querySelector('img');

            if (!url) {
                slot.style.display = 'none';
                if (img) img.removeAttribute('src');
                slot.classList.remove('dimmed');
                return;
            }

            slot.style.display = 'flex';
            slot.classList.toggle('dimmed', !!dimmed);

            if (img) img.src = url;
        }

        function renderVnPortraits(step) {
            const leftId = 'vnPortraitLeft';
            const rightId = 'vnPortraitRight';

            // 先清空两边
            setVnPortraitSlot(leftId, '', false);
            setVnPortraitSlot(rightId, '', false);

            if (step.type !== 'message') return;

            // 当前消息没有立绘：两边都不显示
            if (!step.portraitUrl) return;

            const currentSlotId = step.side === 'right' ? rightId : leftId;
            setVnPortraitSlot(currentSlotId, step.portraitUrl, false);

            // 只看紧挨着的上一条消息
            const prevStep = vnSteps[vnIndex - 1];

            // ★ 上一条是闲聊、且当前不是闲聊：不保留闲聊的立绘
            if (
                prevStep &&
                prevStep.type === 'message' &&
                isChatChannelName(prevStep.msg.channel) &&
                !isChatChannelName(step.msg.channel)
            ) {
                return;
            }

            // 正常情况：上一条是不同角色就保留为半透明
            if (
                prevStep &&
                prevStep.type === 'message' &&
                prevStep.portraitUrl &&
                prevStep.msg.name !== step.msg.name
            ) {
                const prevSlotId = prevStep.side === 'right' ? rightId : leftId;
                setVnPortraitSlot(prevSlotId, prevStep.portraitUrl, true);
            }
        }


        function startVnTyping(text, startOffset = 0) {
            clearVnTimers();

            const textEl = document.getElementById('vnText');
            const extendEl = document.getElementById('vnExtend');
            const hintEl = document.getElementById('vnHint');

            vnCurrentText = text || '';
            vnPageStart = Math.max(0, startOffset);
            vnTextIndex = vnPageStart;
            vnHasMoreText = false;
            vnTyping = true;

            textEl.textContent = '';

            if (extendEl) {
                extendEl.style.visibility = 'hidden';
            }
            if (hintEl) {
                hintEl.textContent = '点击继续 / 空格';
            }

            if (!vnCurrentText || vnTextIndex >= vnCurrentText.length) {
                completeVnTyping();
                return;
            }

            typeVnNextChar();
        }

        function typeVnNextChar() {
            if (!vnTyping) return;

            const textEl = document.getElementById('vnText');
            const hintEl = document.getElementById('vnHint');

            if (vnTextIndex >= vnCurrentText.length) {
                completeVnTyping();
                return;
            }

            vnTextIndex++;
            textEl.textContent = vnCurrentText.slice(vnPageStart, vnTextIndex);

            // 当前页已经装不下了
            if (textEl.scrollHeight > textEl.clientHeight + 1) {
                // 退回一个字，保证不超出边框
                vnTextIndex--;
                textEl.textContent = vnCurrentText.slice(vnPageStart, vnTextIndex);

                vnTyping = false;
                vnHasMoreText = vnTextIndex < vnCurrentText.length;

                if (hintEl) hintEl.textContent = '即将继续…';
                scheduleVnNextPage();
                return;

            }

            vnTypeTimer = setTimeout(typeVnNextChar, 30);
        }

        function completeVnTyping() {
            if (vnTypeTimer) {
                clearInterval(vnTypeTimer);
                vnTypeTimer = null;
            }

            const textEl = document.getElementById('vnText');
            const extendEl = document.getElementById('vnExtend');
            const hintEl = document.getElementById('vnHint');

            // 快速填满当前页，遇到溢出就停下
            while (vnTextIndex < vnCurrentText.length) {
                vnTextIndex++;
                textEl.textContent = vnCurrentText.slice(vnPageStart, vnTextIndex);

                if (textEl.scrollHeight > textEl.clientHeight + 1) {
                    vnTextIndex--;
                    textEl.textContent = vnCurrentText.slice(vnPageStart, vnTextIndex);

                    vnTyping = false;
                    vnHasMoreText = vnTextIndex < vnCurrentText.length;

                    if (hintEl) hintEl.textContent = '即将继续…';
                    scheduleVnNextPage();
                    return;
                }
            }

            // 整段已经打完
            vnTyping = false;
            vnHasMoreText = false;
            textEl.textContent = vnCurrentText.slice(vnPageStart);

            if (extendEl) {
                extendEl.style.visibility = 'visible';
            }
            if (hintEl) {
                hintEl.textContent = '点击继续 / 空格';
            }

            if (vnAuto) {
                scheduleVnAuto();
            }
        }

        // ========== 统一分页计算 ==========
        // 规则：章节消息强制另起一页；每页最多 pageSize 条
        function computePages() {
            const pages = [];
            let i = 0;
            const n = filteredLogs.length;
            while (i < n) {
                const start = i;
                let count = 0;
                while (i < n && count < pageSize) {
                    // 章节消息若不是本页第一条，则本页在此结束（章节归新页）
                    if (count > 0 && filteredLogs[i].isChapter) {
                        break;
                    }
                    i++;
                    count++;
                }
                pages.push({ start, end: i - 1, count: i - start });
            }
            return pages;
        }

        // 根据 filteredLogs 中的索引找到页号
        // 保留同名函数，只是换成基于 computePages 的实现
        function calculatePageForMessage(messageIndex) {
            const pages = computePages();
            for (let i = 0; i < pages.length; i++) {
                if (messageIndex >= pages[i].start && messageIndex <= pages[i].end) {
                    return i + 1;
                }
            }
            return pages.length || 1;
        }

                menu.dataset.scrollBound = '1';
            }
        }

        function setVnLogDrawerOpen(open) {
            const drawer = document.getElementById('vnLogDrawer');
            const menu = document.getElementById('vnLogMenu');
            const overlay = document.getElementById('vnOverlay');

            if (drawer) drawer.classList.toggle('show', open);
            if (menu) menu.classList.toggle('show', open);
            if (overlay) overlay.classList.toggle('vn-log-open', open);
        }
        function refreshVnLogMenuCurrent() {
            if (vnLogSearchKeyword) {
                const menu = document.getElementById('vnLogMenu');
                if (!menu || !menu.classList.contains('show')) return;

                menu.querySelectorAll('.vn-log-item.current')
                    .forEach(el => el.classList.remove('current'));

                const current = menu.querySelector(`[data-step-index="${vnIndex}"]`);
                if (current) current.classList.add('current');

                return;
            }

            const menu = document.getElementById('vnLogMenu');
            if (!menu || !menu.classList.contains('show')) return;

            // 当前句已经不在已渲染的窗口里，重新以它为中心加载
            if (vnIndex < vnLogMenuStart || vnIndex >= vnLogMenuEnd) {
                renderVnLogMenu(true);
                return;
            }

            menu.querySelectorAll('.vn-log-item.current')
                .forEach(el => el.classList.remove('current'));

            const current = menu.querySelector(`[data-step-index="${vnIndex}"]`);
            if (!current) return;

            current.classList.add('current');

            // 如果当前项在可视区外，滚动到中间
            const menuRect = menu.getBoundingClientRect();
            const itemRect = current.getBoundingClientRect();

            if (itemRect.top < menuRect.top || itemRect.bottom > menuRect.bottom) {
                menu.scrollTop +=
                    itemRect.top - menuRect.top
                    - menu.clientHeight / 2
                    + itemRect.height / 2;
            }
        }


        function createVnLogItem(step, index) {
            const el = document.createElement(step.type === 'chapter' ? 'div' : 'button');
            if (step.type !== 'chapter') el.type = 'button';
            el.className = 'vn-log-item';
            el.dataset.stepIndex = index;

            if (step.type === 'chapter') {
                el.classList.add('vn-log-chapter');
                el.textContent = '◆ ' + (step.chapterName || '未命名章节');

                if (index === vnIndex) el.classList.add('current');

                el.addEventListener('click', event => {
                    event.stopPropagation();
                    jumpVnLogStep(index);
                });
                return el;
            }

            if (step.type === 'system') el.classList.add('system');

            const msg = step.msg;
            if (isChatChannelName(msg.channel)) el.classList.add('chat');


            // 角色名
            const speaker = document.createElement('span');
            speaker.className = 'vn-log-speaker';
            speaker.textContent = step.type === 'system'
                ? '旁白'
                : (msg.name || '未知角色');

            const rules = logData.characterRules || {};
            const defaultRule = logData.defaultCharacterRule || {};
            const rule = rules[msg.name] || defaultRule;

            speaker.style.color = step.type === 'system'
                ? 'rgba(255, 255, 255, 0.55)'
                : (msg.color || (rule && rule.nameColor) || 'rgba(255, 255, 255, 0.9)');

            // 气泡
            const bubble = document.createElement('div');
            bubble.className = 'vn-log-bubble';

            if (rule && rule.bubbleColor && typeof hexToRgb === 'function') {
                const opacity = rule.bubbleOpacity !== undefined
                    ? Math.min(rule.bubbleOpacity, 0.35)
                    : 0.22;
                bubble.style.backgroundColor =
                    `rgba(${hexToRgb(rule.bubbleColor)}, ${opacity})`;
            }

            // 正文：不截断，全部显示
            const text = document.createElement('div');
            text.className = 'vn-log-text';
            text.textContent = msg.text || '';
            bubble.appendChild(text);

            // 骰点/扩展结果
            const extendText = getFormattedExtendText(msg) || '';
            if (extendText) {
                const extend = document.createElement('div');
                extend.className = 'vn-log-extend';
                extend.textContent = extendText;
                bubble.appendChild(extend);
            }

            el.appendChild(speaker);
            el.appendChild(bubble);

            if (index === vnIndex) el.classList.add('current');

            el.addEventListener('click', event => {
                event.stopPropagation();
                jumpVnLogStep(index);
            });

            return el;
        }

        function appendVnLogItems(start, end) {
            const menu = document.getElementById('vnLogMenu');
            if (!menu) return;

            const frag = document.createDocumentFragment();
            for (let i = start; i < end; i++) {
                const step = vnSteps[i];
                if (!step) continue;
                frag.appendChild(createVnLogItem(step, i));
            }
            menu.appendChild(frag);
        }

        function prependVnLogItems(start, end) {
            const menu = document.getElementById('vnLogMenu');
            if (!menu) return;

            const prevHeight = menu.scrollHeight;
            const prevTop = menu.scrollTop;

            const frag = document.createDocumentFragment();
            for (let i = start; i < end; i++) {
                const step = vnSteps[i];
                if (!step) continue;
                frag.appendChild(createVnLogItem(step, i));
            }

            menu.insertBefore(frag, menu.firstChild);
            menu.scrollTop = prevTop + (menu.scrollHeight - prevHeight);
        }

        function renderVnLogMenu(reset = true) {
            const menu = document.getElementById('vnLogMenu');
            if (!menu || !reset) return;

            // 默认加载当前位置上下各 50 条
            vnLogMenuStart = Math.max(0, vnIndex - 50);
            vnLogMenuEnd = Math.min(vnSteps.length, vnIndex + 50);
            if (vnLogSearchKeyword) {
                renderVnLogSearchResults();
                return;
            }

            menu.innerHTML = '';
            appendVnLogItems(vnLogMenuStart, vnLogMenuEnd);

            requestAnimationFrame(() => {
                // 内容没撑满就继续往后加载
                if (menu.scrollHeight <= menu.clientHeight + 1) {
                    loadNextVnLogBatch();
                }

                // 滚动到当前项
                const current = menu.querySelector('.vn-log-item.current');
                if (current) {
                    const menuRect = menu.getBoundingClientRect();
                    const itemRect = current.getBoundingClientRect();
                    menu.scrollTop +=
                        itemRect.top - menuRect.top
                        - menu.clientHeight / 2
                        + itemRect.height / 2;
                }
            });
        }

        function handleVnLogMenuScroll() {
            if (vnLogSearchKeyword) return;
            const menu = document.getElementById('vnLogMenu');
            if (!menu || !menu.classList.contains('show')) return;

            // 接近顶部 → 往前加载
            if (menu.scrollTop < 40) {
                loadPreviousVnLogBatch();
            }

            // 接近底部 → 往后加载
            if (menu.scrollTop + menu.clientHeight >= menu.scrollHeight - 60) {
                loadNextVnLogBatch();
            }
        }

        function loadNextVnLogBatch() {
            const menu = document.getElementById('vnLogMenu');
            if (!menu || vnLogMenuEnd >= vnSteps.length) return;

            const newEnd = Math.min(vnSteps.length, vnLogMenuEnd + 50);
            if (newEnd === vnLogMenuEnd) return;

            appendVnLogItems(vnLogMenuEnd, newEnd);
            vnLogMenuEnd = newEnd;

            // 如果加载完还没撑出滚动条，继续补，直到能滚动或到底
            requestAnimationFrame(() => {
                if (menu.scrollHeight <= menu.clientHeight + 1) {
                    loadNextVnLogBatch();
                }
            });
        }

        function loadPreviousVnLogBatch() {
            const menu = document.getElementById('vnLogMenu');
            if (!menu || vnLogMenuStart <= 0) return;

            const newStart = Math.max(0, vnLogMenuStart - 50);
            if (newStart === vnLogMenuStart) return;

            prependVnLogItems(newStart, vnLogMenuStart);
            vnLogMenuStart = newStart;
        }


        function jumpVnLogStep(stepIndex) {
            if (stepIndex < 0 || stepIndex >= vnSteps.length) return;

            vnIndex = stepIndex;
            renderVnStep();
        }

        // 渲染筛选选项
        function renderFilterOptions() {
            if (!logData || !logData.logs) return;
            
            const logs = logData.logs;
            
            // 提取所有频道
            const channels = [...new Set(logs.map(msg => msg.channel).filter(channel => channel))].sort();
            
            // 渲染频道筛选
            document.getElementById('channelFilters').innerHTML = channels.map(channel => `
                <label style="display: block; margin: 4px 0; font-size: 12px;">
                    <input type="checkbox" value="${channel}" 
                        style="margin-right: 6px;">
                    ${channel}
                </label>
            `).join('');
        }
        
        // 更新筛选器
  
        function updateChannelFilter(channel, checked) {
            if (checked) {
                if (!currentFilters.channels.includes(channel)) {
                    currentFilters.channels.push(channel);
                }
            } else {
                currentFilters.channels = currentFilters.channels.filter(c => c !== channel);
            }
        }
        
        // 应用筛选
        function applyFilters() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            currentFilters.searchText = searchText;
            
            // 重置频道筛选数组
            currentFilters.channels = [];
            
            // 收集选中的频道
            document.querySelectorAll('#channelFilters input[type="checkbox"]:checked').forEach(checkbox => {
                currentFilters.channels.push(checkbox.value);
            });
            
            let filtered = logData.logs || [];
            
            // 按频道筛选
            if (currentFilters.channels.length > 0) {
                filtered = filtered.filter(msg => 
                    currentFilters.channels.includes(msg.channel)
                );
            }
            
            // 按搜索文本筛选
            if (searchText) {
                filtered = filtered.filter(msg => 
                    (msg.text && msg.text.toLowerCase().includes(searchText)) ||
                    (msg.name && msg.name.toLowerCase().includes(searchText)) ||
                    (msg.extend && JSON.stringify(msg.extend).toLowerCase().includes(searchText)) ||
                    (typeof msg.dice === 'string' && msg.dice.toLowerCase().includes(searchText))
                );
            }
            
            filteredLogs = filtered;
            currentPage = 1;
            renderView(true);
            closeFilterPanel();
            setTimeout(() => {
                updateChapterImages();
            }, 100);
        }      
        // 清除筛选
        function clearFilters(shouldRender = true, keepChatChannels = false) {
            currentFilters = {
                channels: [],
                searchText: ''
            };

            document.getElementById('searchInput').value = '';

            document.querySelectorAll('#channelFilters input[type="checkbox"]').forEach(checkbox => {
                checkbox.checked = false;
            });

            if (!keepChatChannels) {
                const collapseCheckbox = document.getElementById('collapseChatCheckbox');
                if (collapseCheckbox) {
                    collapseCheckbox.checked = false;
                }
                collapseChatChannels = false;

                const hideCheckbox = document.getElementById('hideChatCheckbox');
                if (hideCheckbox) {
                    hideCheckbox.checked = false;
                }
                hideChatChannels = false;
            }

            filteredLogs = logData.logs || [];
            currentPage = 1;
            closeFilterPanel();

            // 只有需要时才立即渲染
            if (shouldRender) {
                renderView(true);

                setTimeout(() => {
                    updateChapterImages();
                }, 100);
            }
        }

        // 根据消息索引（在 filteredLogs 中的位置）查找所属章节
        function findChapterByMessageIndex(index) {
            if (!chapters || chapters.length === 0) return null;
            const sorted = [...chapters].sort((a, b) => a.position - b.position);
            // 找 filteredLogs 中最后一个 isChapter 且索引 <= index 的章节
            let result = null;
            for (let i = index; i >= 0; i--) {
                if (filteredLogs[i] && filteredLogs[i].isChapter) {
                    const name = filteredLogs[i].text.replace('=== ', '').replace(' ===', '');
                    result = sorted.find(c => c.name === name) || null;
                    if (result) break;
                }
            }
            return result || sorted[0] || null;
        } 

        function toggleViewMode() {
            viewMode = viewMode === 'scroll' ? 'paged' : 'scroll';
            updateViewModeUI();
            renderView(true);
        }

        function updateViewModeUI() {
            const btn = document.getElementById('viewModeBtn');
            const pager = document.getElementById('paginationContainer');

            if (viewMode === 'scroll') {
                btn.textContent = '切换分页模式';
                pager.style.display = 'none';
                document.body.style.paddingBottom = '0';
            } else {
                btn.textContent = '切换连续模式';
                pager.style.display = 'flex';
                document.body.style.paddingBottom = '70px';
            }
        }
        
        function renderView(resetScroll = true) {
            if (viewMode === 'paged') {
                renderCurrentPage();
                return;
            }

            if (resetScroll) {
                currentContinuousChapter = 0;
            }

            renderContinuous(resetScroll);
        }

        // 把 filteredLogs 按章节切成一段一段
        function getChapterRanges() {
            const logs = filteredLogs;
            const ranges = [];

            if (!logs.length) return ranges;

            const chapterStarts = [];
            logs.forEach((msg, index) => {
                if (msg.isChapter) chapterStarts.push(index);
            });

            // 没有任何章节，就当作一个整体
            if (chapterStarts.length === 0) {
                ranges.push({ start: 0, end: logs.length - 1, chapterName: '' });
                return ranges;
            }

            // 第一个章节之前的消息
            if (chapterStarts[0] > 0) {
                ranges.push({
                    start: 0,
                    end: chapterStarts[0] - 1,
                    chapterName: ''
                });
            }

            // 每个章节：从章节消息开始，到下一个章节消息之前
            chapterStarts.forEach((start, i) => {
                const end = i + 1 < chapterStarts.length
                    ? chapterStarts[i + 1] - 1
                    : logs.length - 1;

                const text = logs[start].text || '';
                ranges.push({
                    start,
                    end,
                    chapterName: text.replace('=== ', '').replace(' ===', '').trim()
                });
            });

            return ranges;
        }

        // 获取当前连续章节范围
        function getContinuousRange() {
            const ranges = getChapterRanges();
            if (!ranges.length) return null;

            if (currentContinuousChapter < 0) currentContinuousChapter = 0;
            if (currentContinuousChapter >= ranges.length) {
                currentContinuousChapter = ranges.length - 1;
            }

            return ranges[currentContinuousChapter];
        }

        function renderContinuous(reset = true, upToIndex = null) {
            const container = document.getElementById('logMessages');
            const ranges = getChapterRanges();

            if (!ranges.length) {
                container.innerHTML =
                    '<div style="text-align:center;padding:40px;color:#7f8c8d;">没有找到匹配的消息</div>';
                return;
            }

            // 如果目标是某条消息，先找到它属于哪个章节
            if (upToIndex !== null) {
                const targetRange = ranges.findIndex(r =>
                    upToIndex >= r.start && upToIndex <= r.end
                );
                if (targetRange !== -1) {
                    currentContinuousChapter = targetRange;
                }
            }

            const range = getContinuousRange();
            if (!range) return;

            const chapterLength = range.end - range.start + 1;
            currentRenderedChapter = findChapterByMessageIndex(range.start);

            if (reset) {
                scrollLoadedCount = Math.min(pageSize, chapterLength);
            }

            // 跳转到某条消息时，至少加载到那条消息
            if (upToIndex !== null) {
                const wanted = upToIndex - range.start + 1;
                scrollLoadedCount = Math.min(
                    Math.max(pageSize, wanted),
                    chapterLength
                );
            }

            if (scrollLoadedCount > chapterLength) scrollLoadedCount = chapterLength;
            if (scrollLoadedCount <= 0) scrollLoadedCount = Math.min(pageSize, chapterLength);

            const startAbs = range.start;
            const endAbs = range.start + scrollLoadedCount;

            container.innerHTML = renderLogMessages(
                filteredLogs.slice(startAbs, endAbs)
            );

            container.insertAdjacentHTML(
                'beforeend',
                '<div id="scrollSentinel" style="height:1px;"></div>'
            );

            addMessageDoubleClickHandlers();
            updateChapterEndNav();
            setupScrollObserver();
            setTimeout(() => {
                updateChapterImages();
            }, 100);

        }
        // 连续模式追加一块 HTML，并处理跨块的同频道合并
        function appendRenderedChunk(html) {
            const container = document.getElementById('logMessages');
            const sentinel = document.getElementById('scrollSentinel');
            if (!container || !html) return;

            const temp = document.createElement('div');
            temp.innerHTML = html;

            const nodes = Array.from(temp.children);
            if (!nodes.length) return;

            const insertBefore = sentinel || null;
            const prev = insertBefore
                ? insertBefore.previousElementSibling
                : container.lastElementChild;

            // 上一块结尾和新块开头是同一个频道 → 合并成一个组
            if (
                prev &&
                prev.classList.contains('channel-group') &&
                nodes[0].classList.contains('channel-group') &&
                prev.dataset.channel === nodes[0].dataset.channel
            ) {
                const prevMessages = prev.querySelector('.channel-messages');
                const newMessages = nodes[0].querySelector('.channel-messages');

                if (prevMessages && newMessages) {
                    while (newMessages.firstChild) {
                        prevMessages.appendChild(newMessages.firstChild);
                    }
                    nodes.shift(); // 删除新块里重复的频道组外壳
                }
            }

            nodes.forEach(node => {
                if (insertBefore) {
                    insertBefore.parentNode.insertBefore(node, insertBefore);
                } else {
                    container.appendChild(node);
                }
            });
        }

        function loadMoreScroll() {
            const range = getContinuousRange();
            if (!range) return;

            const chapterLength = range.end - range.start + 1;
            if (scrollLoadedCount >= chapterLength) return;

            const startAbs = range.start + scrollLoadedCount;
            const newCount = Math.min(scrollLoadedCount + pageSize, chapterLength);
            const endAbs = range.start + newCount;

            const html = renderLogMessages(
                filteredLogs.slice(startAbs, endAbs)
            );

            // 只插入一次
            appendRenderedChunk(html);

            scrollLoadedCount = newCount;

            // 如果这一批全部被隐藏，继续加载下一批，避免卡住
            if (!html && scrollLoadedCount < chapterLength) {
                setTimeout(loadMoreScroll, 0);
            }

            addMessageDoubleClickHandlers();
            updateChapterEndNav();
        }


        function jumpToContinuousChapter(index) {
            const ranges = getChapterRanges();
            if (index < 0 || index >= ranges.length) return;

            currentContinuousChapter = index;
            scrollLoadedCount = 0;

            renderContinuous(true);

            const container = document.getElementById('logMessages');
            if (container) {
                container.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function setupScrollObserver() {
            if (scrollObserver) scrollObserver.disconnect();

            const sentinel = document.getElementById('scrollSentinel');
            if (!sentinel) return;

            scrollObserver = new IntersectionObserver(entries => {
                if (entries[0].isIntersecting) {
                    loadMoreScroll();
                }
            }, {
                rootMargin: '300px 0px'
            });

            scrollObserver.observe(sentinel);
        }

        function updateChapterEndNav() {
            const oldNav = document.getElementById('chapterEndNav');
            if (oldNav) oldNav.remove();

            if (viewMode !== 'scroll') return;

            const ranges = getChapterRanges();
            const range = getContinuousRange();
            if (!range) return;

            const chapterLength = range.end - range.start + 1;

            // 当前章节还没加载完，不显示
            if (scrollLoadedCount < chapterLength) return;

            // 只有一个章节/整体时不显示
            if (ranges.length <= 1) return;

            const idx = currentContinuousChapter;
            const prev = idx > 0 ? ranges[idx - 1] : null;
            const next = idx < ranges.length - 1 ? ranges[idx + 1] : null;
            const label = range.chapterName || '本章';

            const navHtml = `
                <div id="chapterEndNav" class="chapter-end-nav">
                    <button class="pagination-btn"
                        onclick="jumpToContinuousChapter(${idx - 1})"
                        ${prev ? '' : 'disabled'}>上一章</button>

                    <span>${label}</span>

                    <button class="pagination-btn"
                        onclick="jumpToContinuousChapter(${idx + 1})"
                        ${next ? '' : 'disabled'}>下一章</button>
                </div>
            `;

            const sentinel = document.getElementById('scrollSentinel');
            if (sentinel) {
                sentinel.insertAdjacentHTML('beforebegin', navHtml);
            }
        }

        // 渲染当前页
        function renderCurrentPage() {
            const pages = computePages();

            // 空数据保护
            if (pages.length === 0) {
                currentRenderedChapter = null;
                document.getElementById('logMessages').innerHTML =
                    '<div style="text-align: center; padding: 40px; color: #7f8c8d;">没有找到匹配的消息</div>';
                updatePaginationInfo();
                return;
            }

            // 页码越界时夹紧（关键：防止 currentPage 超过真实页数导致空白）
            if (currentPage < 1) currentPage = 1;
            if (currentPage > pages.length) currentPage = pages.length;

            const { start, end } = pages[currentPage - 1];
            const pageMessages = filteredLogs.slice(start, end + 1);

            currentRenderedChapter = findChapterByMessageIndex(start);

            const container = document.getElementById('logMessages');
            container.innerHTML = renderLogMessages(pageMessages);

            updatePaginationInfo();
            window.scrollTo({ top: 0, behavior: 'smooth' });

            setTimeout(() => { updateChapterImages(); }, 100);
            addMessageDoubleClickHandlers();
        }

        // 添加双击事件处理函数
        function addMessageDoubleClickHandlers() {
            const messageRows = document.querySelectorAll('.message-row');

            messageRows.forEach(row => {
                if (row.dataset.dblclickBound === '1') return;
                row.dataset.dblclickBound = '1';

                row.addEventListener('dblclick', function() {
                    const messageId = this.getAttribute('data-id');
                    if (messageId) {
                        jumpToMessage(messageId);
                    }
                });
            });
        }

        function jumpToMessage(messageId) {
            const allLogs = logData.logs || [];
            const targetId = String(messageId);

            const messageIndex = allLogs.findIndex(
                msg => String(msg.id) === targetId
            );

            if (messageIndex === -1) {
                alert('未找到该消息，可能消息已被删除或修改');
                return;
            }

            // 先清筛选（只改状态，不渲染），让 filteredLogs 回到完整日志
            clearFilters(false, true);

            if (viewMode === 'scroll') {
                // 用完整日志里的索引定位章节，并加载到目标消息
                renderContinuous(true, messageIndex);
                setTimeout(() => highlightMessage(targetId), 350);
            } else {
                currentPage = calculatePageForMessage(messageIndex);
                renderCurrentPage();
                setTimeout(() => highlightMessage(targetId), 350);
            }
        }


        // 添加高亮函数
        function highlightMessage(messageId) {
            const targetId = String(messageId);
            const targetRow = Array.from(document.querySelectorAll('.message-row'))
                .find(row => row.dataset.id === targetId);

            if (targetRow) {
                targetRow.style.backgroundColor = 'rgba(139, 0, 0, 0.1)';
                targetRow.style.borderLeft = '3px solid #8b0000';
                targetRow.style.transition = 'all 0.3s ease';

                targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });

                setTimeout(() => {
                    targetRow.style.backgroundColor = '';
                    targetRow.style.borderLeft = '';
                }, 5000);
            }
        }

        // 渲染日志消息
        function renderLogMessages(logs) {
            // 隐藏所有闲聊频道时，先过滤掉闲聊消息，再分组
            // 否则闲聊会像“隐形分隔符”把前后同频道拆成两组
            const visibleLogs = hideChatChannels
                ? logs.filter(msg => {
                    if (!msg) return false;
                    const channel = msg.channel || '默认频道';
                    const isChat = chatChannelKeywords.some(keyword =>
                        channel.includes(keyword)
                    );
                    return !isChat;
                })
                : logs;

            if (visibleLogs.length === 0) {
                return '<div style="text-align: center; padding: 40px; color: #7f8c8d;">没有找到匹配的消息</div>';
            }
            
            // 按频道分组
            const groups = [];
            let currentGroup = null;
            
            visibleLogs.forEach((msg, index) => {
                // 章节消息特殊处理
                if (msg.isChapter) {
                    if (currentGroup) {
                        groups.push(currentGroup);
                        currentGroup = null;
                    }
                    
                    groups.push({
                        isChapter: true,
                        chapter: msg
                    });
                    return;
                }
                
                // 频道分组
                const channel = msg.channel || '默认频道';
                
                if (!currentGroup || currentGroup.channel !== channel) {
                    if (currentGroup) groups.push(currentGroup);
                    currentGroup = {
                        channel: channel,
                        messages: [msg]
                    };
                } else {
                    currentGroup.messages.push(msg);
                }
            });
            
            if (currentGroup) groups.push(currentGroup);
            
            // 生成HTML
            let html = '';
            groups.forEach(group => {
                if (group.isChapter) {
                    html += renderChapter(group.chapter);
                } else {
                    html += renderChannelGroup(group);
                }
            });
            
            return html;
        }
        
        // 渲染章节
        function renderChapter(chapter) {
            const chapterStyle = getChapterStyle(chapter);
            const chapterName = chapter.text.replace('=== ', '').replace(' ===', '');

        // 渲染频道组

            const isChatChannel = chatChannelKeywords.some(keyword =>
                group.channel.includes(keyword)
            );
            // 隐藏所有闲聊频道：整组不渲染
            if (isChatChannel && hideChatChannels) {
                return '';
            }

            // 每一段连续的频道组用“频道名 + 第一条消息 id”作为唯一 key
            const firstMsg = group.messages[0] || {};
            const groupKey = group.channel + '::' + (firstMsg.id || firstMsg.text || '');
            const safeKey = String(groupKey).replace(/"/g, '&quot;');

            const isCollapsed = isChatChannel && isChannelGroupCollapsed(groupKey);

            // 始终渲染消息，用 CSS 控制显示/隐藏，点击展开时不需要重新渲染
            const messagesHtml = group.messages.map(msg => renderMessage(msg)).join('');

        // 判断某个频道组当前是否折叠
        function isChannelGroupCollapsed(key) {
            if (collapseChatChannels) {
                // 全局折叠开启时，默认折叠；点开过的加入 expanded
                return !expandedChannelGroups.has(key);
            }
            // 全局折叠关闭时，只有手动点过的才折叠
            return collapsedChannelGroups.has(key);
        }

        // 点击频道名：只折叠/展开当前这一段
        function toggleChannelGroup(el) {
            const key = el.getAttribute('data-group-key');
            if (!key) return;

            if (collapseChatChannels) {
                if (expandedChannelGroups.has(key)) {
                    expandedChannelGroups.delete(key);
                } else {
                    expandedChannelGroups.add(key);
                }
            } else {
                if (collapsedChannelGroups.has(key)) {
                    collapsedChannelGroups.delete(key);
                } else {
                    collapsedChannelGroups.add(key);
                }
            }

            const groupEl = el.closest('.channel-group');
            const messagesEl = groupEl.querySelector('.channel-messages');
            const labelEl = el.querySelector('.channel-collapse-label');
            const tipEl = groupEl.querySelector('.channel-collapsed-tip');

            const collapsed = isChannelGroupCollapsed(key);

            groupEl.classList.toggle('collapsed', collapsed);

            if (messagesEl) {
                messagesEl.style.display = collapsed ? 'none' : '';
            }
            if (labelEl) {

        // 渲染单条消息

        // ========== 样式获取函数 ==========

        // 添加hexToRgba辅助函数
        function hexToRgba(hex, opacity) {
            hex = hex.replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);

        // 获取频道背景样式

        // HEX转RGB
        function hexToRgb(hex) {

            if (hex.length === 3) {

            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            
            return `${r}, ${g}, ${b}`;
        }

        // 获取系统消息样式
