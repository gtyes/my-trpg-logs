        }
        // 添加繁简转换函数
        function traditionalToSimple(text) {
            if (!text) return text;
            
            // 简繁转换表（仅处理需要的词汇）
            const mapping = {
                '極限': '极限',
                '成功': '成功',
                '失敗': '失败',
                '大成功': '大成功',
                '大失败': '大失败'
            };
            
            let result = text;
            // 替换词汇
            for (const [traditional, simple] of Object.entries(mapping)) {
                result = result.replace(new RegExp(traditional, 'g'), simple);
            }
            
            return result;
        }
        // 处理骰点文本：简化「獎勵・懲罰骰」，并移除 [0] 部分（当数字为0时）
        function formatDiceTextForDisplay(text) {
            if (!text) return text;
            
            // 先繁转简
            let result = traditionalToSimple(text);
            
            // 匹配「獎勵・懲罰骰[数字]」或「奖励惩罚骰[数字]」
            // 注意：可能已经是简体，所以用 /獎勵・懲罰骰|奖励惩罚骰/ 匹配
            const regex = /(獎勵・懲罰骰|奖励惩罚骰)\[(\d+)\]/g;
            
            result = result.replace(regex, (match, prefix, number) => {
                if (number === '0') {
                    return ''; // 数字为0，删除整段
                } else {
                    return `奖励惩罚骰[${number}]`; // 非0，替换为简体
                }
            });
            
            // 清理多余的空格（如果删除后出现双空格，可整理）
            result = result.replace(/\s{2,}/g, ' ').trim();
            
            return result;
        }
        // 格式化扩展内容
        // 重新实现formatExtendContent函数
        function formatExtendContent(msg) {
            // 优先使用extend字段
            if (msg.extend) {
                if (typeof msg.extend === 'string') {
                    try {
                        // 尝试解析JSON字符串
                        const parsed = JSON.parse(msg.extend);
                        if (parsed && parsed.roll && parsed.roll.result) {
                            return parsed.roll.result;
                        }
                        return msg.extend;
                    } catch (e) {
                        // 如果不是JSON，直接返回字符串
                        return msg.extend;
                    }
                } else if (typeof msg.extend === 'object') {
                    // 如果是对象，提取roll.result
                    if (msg.extend.roll && msg.extend.roll.result) {
                        return msg.extend.roll.result;
                    }
                    // 尝试转换为字符串
                    try {
                        return JSON.stringify(msg.extend);
                    } catch (e) {
                        return String(msg.extend);
                    }
                }
            }
            // 如果没有extend，使用dice字段
            return msg.dice || '';
        }     

        // 获取扩展结果类型
        // 新增辅助函数：解析骰子文本
        function parseDiceText(text) {
            let simple = traditionalToSimple(text);
            let match = simple.match(/(\d+)\s*[＞>]\s*(.+)/);
            if (!match) return null;
            let number = parseInt(match[1]);
            let resultText = match[2].trim();
            let isSuccess = resultText.includes('成功') && !resultText.includes('失败');
            let isFailure = resultText.includes('失败');
            return { number, resultText, isSuccess, isFailure };
        }

        // 核心判定函数
        function determineResultTypeWithRule(msg, ruleSystem) {
            const originalText = formatExtendContent(msg);
            if (!originalText) return 'normal';
            
            let simpleText = traditionalToSimple(originalText);
            // 如果原文已经明确是大成功或大失败
            if (simpleText.includes('大失败')) return 'criticalFailure';
            if (simpleText.includes('大成功')) return 'criticalSuccess';
            
            let parsed = parseDiceText(originalText);
            if (!parsed) return 'normal';
            
            const { number, isSuccess, isFailure } = parsed;
            
            if (ruleSystem === 'coc') {
                // COC 原样：不创造额外的大成功/大失败
                return isSuccess ? 'success' : (isFailure ? 'failure' : 'normal');
            }
            else if (ruleSystem === 'coc_houserule') {
                // COC房规
                if (isFailure && number >= 96) return 'criticalFailure';
                if (isSuccess && number <= 5) return 'criticalSuccess';
                return isSuccess ? 'success' : (isFailure ? 'failure' : 'normal');
            }
            else if (ruleSystem === 'dg') {
                // 辅助函数：判断是否为两位相同（11,22,...,99,100）
                const isDoubleNumber = (n) => {
                    if (n === 100) return true;      // 100 视为 00，两位相同
                    if (n < 10) return false;        // 1-9 不是两位数，但1已经单独处理
                    const tens = Math.floor(n / 10);
                    const units = n % 10;
                    return tens === units;
                };
                
                if (isSuccess) {
                    if (number === 1 || isDoubleNumber(number)) return 'criticalSuccess';
                    else return 'success';
                }
                if (isFailure) {
                    if (isDoubleNumber(number)) return 'criticalFailure';
                    else return 'failure';
                }
                return 'normal';
            }
            return 'normal';
        }

        // 新的 getExtendResultType
        function getExtendResultType(msg) {
            return determineResultTypeWithRule(msg, extendSettings.ruleSystem);
        }

        // 新的 getFormattedExtendText
        function getFormattedExtendText(msg) {
            const extendText = formatExtendContent(msg);
            if (!extendText) return '';
            
            const resultType = getExtendResultType(msg);
            let text = traditionalToSimple(extendText);
            
            // 处理「獎勵・懲罰骰」和 [0] 隐藏
            text = formatDiceTextForDisplay(text);
            
            // 根据规则调整成功/失败描述（大成功/大失败）
            if (resultType === 'criticalSuccess') {
                text = text.replace(/(\d+\s*[＞>]\s*)(.+)/, (match, prefix, suffix) => {
                    if (suffix.includes('成功')) return prefix + '大成功';
                    return match;
                });
            }
            else if (resultType === 'criticalFailure') {
                text = text.replace(/(\d+\s*[＞>]\s*)(.+)/, (match, prefix, suffix) => {
                    if (suffix.includes('失败')) return prefix + '大失败';
                    return match;
                });
            }
            // DG规则下统一“成功”/“失败”
            else if (extendSettings.ruleSystem === 'dg') {
                if (resultType === 'success') {
                    text = text.replace(/(\d+\s*[＞>]\s*).+成功/, '$1成功');
                } else if (resultType === 'failure') {
                    text = text.replace(/(\d+\s*[＞>]\s*).+失败/, '$1失败');
                }
            }
            
            return text;
        }

        // 获取扩展内容样式
        function getExtendStyle(resultType) {
            const format = (extendFormats && extendFormats[resultType]) ? extendFormats[resultType] : {};
            let style = '';
            
            // 基础extend设置
            const fontSettings = logData.fontSettings || {};
            if (fontSettings.extendText) style += `font-family: ${fontSettings.extendText};`;
            if (fontSettings.extendTextColor) style += `color: ${fontSettings.extendTextColor};`;
            if (fontSettings.extendTextSize) style += `font-size: ${fontSettings.extendTextSize}px;`;
            
            // 特殊格式（使用编辑器设置的格式）
            if (format.color) style += `color: ${format.color};`;
            if (format.fontFamily) style += `font-family: ${format.fontFamily};`;
            if (format.fontSize) style += `font-size: ${format.fontSize}px;`;
            if (format.bold) style += `font-weight: bold;`;
            
            console.log(`extend样式 (${resultType}):`, style);
            return style;
        }
        
        // 获取扩展图片
        function getExtendImage(resultType) {
            const format = (extendFormats && extendFormats[resultType]) ? extendFormats[resultType] : {};
            return format.image || null;
        }
        

        // ========== 分页功能 ==========
        function updatePaginationInfo() {
            const pages = computePages();
            const totalPages = Math.max(1, pages.length);

            // 夹紧 currentPage
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            document.getElementById('currentPage').textContent = currentPage;
            document.getElementById('totalPages').textContent = totalPages;

            document.getElementById('prevPageBtn').disabled = currentPage === 1;
            document.getElementById('nextPageBtn').disabled = currentPage === totalPages;
            document.getElementById('jumpInput').value = currentPage;
            document.getElementById('jumpInput').max = totalPages;
        }
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderCurrentPage();
            }
        }
        
        function nextPage() {
            const totalPages = parseInt(document.getElementById('totalPages').textContent);
            if (currentPage < totalPages) {
                currentPage++;
                renderView(false);
            }
        }
        
        function jumpToPage() {
            const input = document.getElementById('jumpInput');
            let page = parseInt(input.value);
            const totalPages = parseInt(document.getElementById('totalPages').textContent);
            
            if (isNaN(page) || page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            
            currentPage = page;
            input.value = page;
            renderCurrentPage();
        }
        // 章节跳转
        function jumpToChapter(chapterIndex) {
            const chapter = chapters[chapterIndex];
            if (!chapter) return;

            clearFilters(false, true); 

            setTimeout(() => {
                if (viewMode === 'scroll') {
                    const ranges = getChapterRanges();
                    const rangeIndex = ranges.findIndex(
                        r => r.chapterName === chapter.name
                    );

                    if (rangeIndex !== -1) {
                        jumpToContinuousChapter(rangeIndex);
                    }
                } else {
                    const chapterMsgIndex = filteredLogs.findIndex(msg => {
                        if (!msg.isChapter) return false;
                        const name = (msg.text || '')
                            .replace('=== ', '')
                            .replace(' ===', '')
                            .trim();
                        return name === chapter.name;
                    });

                    if (chapterMsgIndex !== -1) {
                        currentPage = calculatePageForMessage(chapterMsgIndex);
                        renderCurrentPage();
                    }
                }
            }, 100);
        }

        // ========== UI控制函数 ==========
        function toggleChapterSidebar() {
            const sidebar = document.getElementById('chapterSidebar');
            const isMobile = window.innerWidth <= 768;
            
            if (isMobile) {
                // 手机端：直接切换 show 类
                sidebar.classList.toggle('show');
            } else {
                // 桌面端：切换显示/隐藏状态
                if (sidebar.style.display === 'none' || sidebar.style.display === '') {
                    // 显示侧边栏
                    sidebar.style.display = 'block';
                    // 确保有 show 类（用于移动端）
                    sidebar.classList.add('show');
                } else {
                    // 隐藏侧边栏
                    sidebar.style.display = 'none';
                    sidebar.classList.remove('show');
                }
            }
            
            if (document.getElementById('filterPanel').classList.contains('show')) {
                closeFilterPanel();
            }
        }
                    
        function toggleFilterPanel() {
            document.getElementById('filterPanel').classList.toggle('show');
        }
        
        function closeFilterPanel() {
            document.getElementById('filterPanel').classList.remove('show');
        }
        
        // 图片预览模态框
        function showImageModal(imageUrl) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.9);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 2000;
                cursor: pointer;
            `;
            
            modal.innerHTML = `
                <div style="position: relative; max-width: 90%; max-height: 90%;">
                    <img src="${imageUrl}" style="max-width: 100%; max-height: 100%; border-radius: 8px;">
                    <button onclick="this.parentElement.parentElement.remove()" 
                            style="position: absolute; top: -40px; right: 0; background: none; border: none; color: white; font-size: 24px; cursor: pointer;">
                        ✕
                    </button>
                </div>
            `;
            
            modal.onclick = function(e) {
                if (e.target === modal) {
                    document.body.removeChild(modal);
                }
            };
            
            document.body.appendChild(modal);
        }
        // 搜索框输入时显示清除按钮
        document.getElementById('searchInput').addEventListener('input', function() {
            const clearBtn = document.querySelector('.clear-search-btn');
            clearBtn.style.display = this.value ? 'block' : 'none';
        });
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.querySelector('.clear-search-btn').style.display = 'none';
            clearFilters(); // 使用已有的清除筛选函数
        }
        // 搜索框回车事件
        document.getElementById('searchInput').addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                applyFilters();
            }
        });
        
        // 点击外部关闭面板
        document.addEventListener('click', function(event) {
            const chapterSidebar = document.getElementById('chapterSidebar');
            const filterPanel = document.getElementById('filterPanel');
            const chapterBtn = document.querySelector('[onclick="toggleChapterSidebar()"]');
            const filterBtn = document.querySelector('[onclick="toggleFilterPanel()"]');
            
            if (!filterPanel.contains(event.target) && !filterBtn.contains(event.target)) {
                closeFilterPanel();
            }
        });

        // ===== 全屏状态变化：更新“全屏 / 退出全屏”按钮文字 =====
        function updateVnFullscreenButton() {
            const btn = document.getElementById('vnFullscreenBtn');
            if (!btn) return;

            const isFullscreen = !!(
                document.fullscreenElement ||
                document.webkitFullscreenElement
            );

            btn.textContent = isFullscreen ? '退出全屏' : '全屏';
        }

        document.addEventListener('fullscreenchange', updateVnFullscreenButton);
        document.addEventListener('webkitfullscreenchange', updateVnFullscreenButton);
        // 对话列表搜索框：空的时候失焦自动收起
        const vnLogSearchInput = document.getElementById('vnLogSearchInput');
        if (vnLogSearchInput) {
            vnLogSearchInput.addEventListener('blur', function() {
                if (!this.value.trim()) {
                    const header = document.getElementById('vnLogDrawerHeader');
                    if (header) {
                        header.classList.remove('searching');
                    }
                }
            });
        }
        // 初始化加载
        window.addEventListener('DOMContentLoaded', loadLogData);
    </script>
</body>
</html>
